<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoopNotes</title>
<style>
  :root { --bg:#0D1724; --panel:#14213a; --teal:#2EC4B6; --orange:#FF9F1C; --text:#F4F7FA; --dim:#8a97ab; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; display:flex; justify-content:center; padding:48px 16px; }
  main { width:100%; max-width:480px; }
  h1 { font-family: ui-monospace, Menlo, monospace; margin:0 0 4px; }
  h1 span { color:var(--teal); }
  .env { color:var(--dim); font-size:14px; margin-bottom:24px; }
  form { display:flex; gap:8px; margin-bottom:16px; }
  input { flex:1; padding:12px; border-radius:10px; border:2px solid #24324a; background:var(--panel); color:var(--text); font-size:16px; }
  button { padding:12px 16px; border:0; border-radius:10px; background:var(--teal); color:var(--bg); font-weight:700; cursor:pointer; }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid #24324a; }
  li.done span { text-decoration:line-through; color:var(--dim); }
  li span { flex:1; cursor:pointer; }
  li button { background:transparent; color:var(--orange); padding:4px 8px; }
</style>
</head>
<body>
<main>
  <h1>Loop<span>Notes</span></h1>
  <div class="env" id="env">checking server…</div>
  <form id="f"><input id="t" placeholder="Add a note" maxlength="200" required><button>Add</button></form>
  <ul id="list"></ul>
</main>
<script>
  const list = document.getElementById('list');
  async function load() {
    const notes = await (await fetch('/api/notes')).json();
    list.innerHTML = '';
    for (const n of notes) {
      const li = document.createElement('li'); if (n.done) li.className = 'done';
      const s = document.createElement('span'); s.textContent = n.text; s.onclick = () => fetch('/api/notes/' + n.id, { method: 'PATCH' }).then(load);
      const d = document.createElement('button'); d.textContent = 'Delete'; d.onclick = () => fetch('/api/notes/' + n.id, { method: 'DELETE' }).then(load);
      li.append(s, d); list.append(li);
    }
  }
  document.getElementById('f').onsubmit = async (e) => {
    e.preventDefault(); const t = document.getElementById('t');
    await fetch('/api/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: t.value }) });
    t.value = ''; load();
  };
  fetch('/health').then(r => r.json()).then(h => document.getElementById('env').textContent = 'Environment: ' + h.env + ' · server healthy');
  load();
</script>
</body>
</html>
